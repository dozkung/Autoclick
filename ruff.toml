line-length = 110
target-version = "py310"

[lint]
# pyflakes + pycodestyle (error/warning) + เรียง import
# ไม่เปิด BLE/S110: โค้ดตั้งใจ except Exception กว้างๆ (spec 6.5: worker ห้ามตายเงียบ, หมุดต้องขึ้นเสมอ)
select = ["E", "F", "W", "I"]

[lint.isort]
known-first-party = ["autoclicker", "support", "ui_support"]

[lint.per-file-ignores]
# เทสต์ต้องเรียก support.install_stubs() ก่อน import module ที่ใช้ tkinter/pynput
"tests/*" = ["E402"]
